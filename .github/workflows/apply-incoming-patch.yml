name: Apply incoming engineering patch

on:
  push:
    branches: [main]
    paths:
      - "incoming/meeting-mom.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply supplied patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --3way incoming/meeting-mom.patch

      - name: Install test dependencies
        run: pip install -r processor/requirements.txt

      - name: Validate patch
        run: |
          python -m py_compile processor/scripts/process_meeting.py processor/scripts/pipeline/speech_quality.py
          python -m unittest discover -s processor/tests -p "test_*.py" -v

      - name: Remove patch helper files and push
        run: |
          rm -f incoming/meeting-mom.patch .github/workflows/apply-incoming-patch.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:main
