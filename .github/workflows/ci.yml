name: Meeting MoM Contract CI

on:
  push:
    branches: [main]
    paths:
      - "processor/**"
      - "google-apps-script/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "processor/**"
      - "google-apps-script/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: meeting-mom-contract-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: processor/requirements.txt
      - run: pip install -r processor/requirements.txt
      - run: python -m unittest discover -s processor/tests -p 'test_*.py' -v
      - name: Apps Script gateway tests (real Code.gs in a mocked Google runtime)
        run: node --test google-apps-script/tests/gateway.test.js
