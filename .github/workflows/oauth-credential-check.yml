name: Google OAuth Credential Check

on:
  push:
    paths:
      - '.github/workflows/oauth-credential-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check V1 Google OAuth refresh token without exposing credentials
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, requests
          names = ("GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_SECRET", "GOOGLE_OAUTH_REFRESH_TOKEN")
          missing = [n for n in names if not os.environ.get(n)]
          if missing:
              print("MISSING_SECRET_NAMES=" + ",".join(missing))
              sys.exit(2)
          response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": os.environ["GOOGLE_OAUTH_CLIENT_ID"],
                  "client_secret": os.environ["GOOGLE_OAUTH_CLIENT_SECRET"],
                  "refresh_token": os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              },
              timeout=30,
          )
          if response.ok:
              body = response.json()
              print("OAUTH_REFRESH=SUCCESS")
              print("ACCESS_TOKEN_RETURNED=" + str(bool(body.get("access_token"))))
              print("TOKEN_TYPE=" + str(body.get("token_type", "unknown")))
              sys.exit(0)
          try:
              body = response.json()
              print("OAUTH_REFRESH=FAILED")
              print("HTTP_STATUS=" + str(response.status_code))
              print("ERROR_CODE=" + str(body.get("error", "unknown")))
              print("ERROR_DESCRIPTION=" + str(body.get("error_description", ""))[:500])
          except Exception:
              print("OAUTH_REFRESH=FAILED")
              print("HTTP_STATUS=" + str(response.status_code))
              print("ERROR_DESCRIPTION=Non-JSON response")
          sys.exit(1)
          PY
