name: Meeting MoM Online

on:
  workflow_dispatch:
  repository_dispatch:
    types: [meeting-ready]

permissions:
  contents: read

env:
  AI_MODEL: qwen3:4b-instruct-2507-q4_K_M
  AI_BATCH_MODEL: qwen3:1.7b-q4_K_M
  AI_FINAL_MODEL: qwen3:4b-instruct-2507-q4_K_M
  AI_NUM_CTX: 8192
  AI_NUM_PREDICT: 1800
  AI_CHUNK_CHARS: 12000
  OLLAMA_MODELS: /home/runner/.ollama/models

jobs:
  warm-processor-cache:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: processor/requirements.txt
      - run: pip install -r processor/requirements.txt
      - name: Whisper runtime
        uses: ./.github/actions/whisper-runtime
      - name: Restore AI model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen3-fast-batch-1.7b-final-4b-v3
      - name: Warm Ollama models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$OLLAMA_MODELS"
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$AI_BATCH_MODEL"
          ollama pull "$AI_FINAL_MODEL"

  prepare:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix_json: ${{ steps.matrix.outputs.matrix_json }}
      batch_total: ${{ steps.matrix.outputs.batch_total }}
      duration_seconds: ${{ steps.matrix.outputs.duration_seconds }}
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      MEETING_ID: ${{ github.event.client_payload.meeting_id }}
      AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
      MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
      AUDIO_FILE_ID: ${{ github.event.client_payload.audio_file_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: processor/requirements.txt
      - run: pip install -r processor/requirements.txt
      - name: Validate meeting dispatch payload
        run: |
          test -n "$MEETING_ID" || { echo "::error::MEETING_ID is missing from repository_dispatch payload."; exit 1; }
          test -n "$MEETING_FOLDER_ID" || { echo "::error::MEETING_FOLDER_ID is missing from repository_dispatch payload."; exit 1; }
          test -n "$AUDIO_FOLDER_ID" || { echo "::error::AUDIO_FOLDER_ID is missing from repository_dispatch payload."; exit 1; }
          test -n "$AUDIO_FILE_ID" || { echo "::error::AUDIO_FILE_ID is missing from repository_dispatch payload."; exit 1; }
      - name: Initialize processing status
        run: python processor/scripts/process_meeting.py --stage init
      - name: Discover duration and dynamic matrix
        id: matrix
        run: python processor/scripts/pipeline/parallel_batch.py --mode prepare

  parallel-batches:
    if: github.event_name == 'repository_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        batch_index: ${{ fromJSON(needs.prepare.outputs.matrix_json) }}
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      MEETING_ID: ${{ github.event.client_payload.meeting_id }}
      AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
      MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
      AUDIO_FILE_ID: ${{ github.event.client_payload.audio_file_id }}
      BATCH_INDEX: ${{ matrix.batch_index }}
      BATCH_TOTAL: ${{ needs.prepare.outputs.batch_total }}
      MEETING_DURATION_SECONDS: ${{ needs.prepare.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: processor/requirements.txt
      - run: pip install -r processor/requirements.txt
      - name: Whisper runtime
        uses: ./.github/actions/whisper-runtime
      - name: Restore AI model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen3-fast-batch-1.7b-final-4b-v3
      - name: Start local Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$OLLAMA_MODELS"
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          if ! ollama list | awk 'NR>1 {print $1}' | grep -Fxq "$AI_BATCH_MODEL"; then ollama pull "$AI_BATCH_MODEL"; fi
      - name: Process batch
        run: python processor/scripts/pipeline/parallel_batch.py --mode worker
      - name: Cleanup batch workspace
        if: always()
        run: rm -rf .meeting_work_parallel

  finalize:
    if: ${{ github.event_name == 'repository_dispatch' && needs.prepare.result == 'success' && needs.parallel-batches.result == 'success' }}
    needs: [prepare, parallel-batches]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      MEETING_ID: ${{ github.event.client_payload.meeting_id }}
      AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
      MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
      AUDIO_FILE_ID: ${{ github.event.client_payload.audio_file_id }}
      BATCH_TOTAL: ${{ needs.prepare.outputs.batch_total }}
      MEETING_DURATION_SECONDS: ${{ needs.prepare.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: processor/requirements.txt
      - run: pip install -r processor/requirements.txt
      - name: Restore AI model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen3-fast-batch-1.7b-final-4b-v3
      - name: Start local Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$OLLAMA_MODELS"
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          if ! ollama list | awk 'NR>1 {print $1}' | grep -Fxq "$AI_FINAL_MODEL"; then ollama pull "$AI_FINAL_MODEL"; fi
      - name: Final synthesis and MoM
        run: python processor/scripts/pipeline/parallel_batch.py --mode finalize
      - name: Mark processing failed if finalization failed
        if: failure()
        env:
          FAILED_ERROR_CODE: MOM-019
          FAILED_STEP: parallel-finalize
        run: python processor/scripts/process_meeting.py --stage fail
      - name: Cleanup
        if: always()
        run: rm -rf .meeting_work_parallel .meeting_work
