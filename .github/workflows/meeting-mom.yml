name: Meeting MoM Online

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meeting-mom.yml"
      - "processor/**"
      - "processor/tests/**"
  workflow_dispatch:
  repository_dispatch:
    types: [meeting-ready]

permissions:
  contents: read

jobs:

  warm-processor-cache:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify system tools
        run: |
          missing=0
          for tool in ffmpeg cmake git curl; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: pre-installed"
            else
              echo "$tool: missing"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg cmake build-essential git curl
          fi

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: processor/requirements.txt

      - name: Install Python dependencies
        run: pip install -r processor/requirements.txt

      - name: Whisper runtime (cached build, models and VAD)
        uses: ./.github/actions/whisper-runtime

      - name: Restore AI model cache
        id: ai-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen2.5-1.5b-instruct-q3_K_L-v1

      - name: Prepare AI model cache
        env:
          AI_MODEL: qwen2.5:1.5b-instruct-q3_K_L
          OLLAMA_MODELS: /home/runner/.ollama/models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$OLLAMA_MODELS"
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done

          if ollama list | awk 'NR>1 {print $1}' | grep -Fxq "$AI_MODEL"; then
            echo "AI model already cached."
          else
            echo "Downloading AI model for reusable cache..."
            ollama pull "$AI_MODEL"
          fi

          echo "Reusable processor cache is ready."

  unit-tests:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r processor/requirements.txt

      - name: Run online pipeline contract tests
        run: python -m unittest discover -s processor/tests -p "test_*.py" -v

  test-drive-connection:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: processor/requirements.txt

      - name: Install Python dependencies
        run: pip install -r processor/requirements.txt

      - name: Test Google Drive access
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python processor/scripts/test_drive_connection.py

  process-meeting:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
      WHISPER_THREADS: 4
      AUDIO_FILE_ID: ${{ github.event.client_payload.audio_file_id }}
      STRICT_AUDIO_SELECTION: "true"
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Privacy boundary check
        run: python processor/scripts/privacy_check.py

      - name: Validate meeting request
        env:
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: |
          test -n "$MEETING_ID" || (echo "Meeting ID missing" && exit 1)
          test -n "$AUDIO_FOLDER_ID" || (echo "Audio folder ID missing" && exit 1)
          test -n "$MEETING_FOLDER_ID" || (echo "Meeting folder ID missing" && exit 1)
          echo "Meeting request validated."

      - name: Check Google Drive OAuth credential
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ -n "$GOOGLE_OAUTH_REFRESH_TOKEN" ] && [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] && [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            echo "Google Drive credential: OAuth refresh-token mode."
          else
            echo "ERROR: Google Drive OAuth credentials are incomplete."
            echo "Configure GOOGLE_OAUTH_CLIENT_ID + GOOGLE_OAUTH_CLIENT_SECRET + GOOGLE_OAUTH_REFRESH_TOKEN."
            exit 1
          fi

      # ubuntu-latest already contains the common build/runtime tools we need.
      # Only install them as a fallback if a future runner image removes one.
      - name: Verify system tools
        run: |
          missing=0
          for tool in ffmpeg cmake git curl; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: pre-installed"
            else
              echo "$tool: missing"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Installing only missing system tools..."
            sudo apt-get update
            sudo apt-get install -y ffmpeg cmake build-essential git curl
          else
            echo "All system tools are already available. Skipping apt installation."
          fi

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: processor/requirements.txt

      - name: Install Python dependencies
        run: |
          echo "Installing Python dependencies from cached pip packages..."
          pip install -r processor/requirements.txt

      # Whisper.cpp is expensive to compile, so cache the final executable
      # and model. The first run builds/downloads them; later meetings restore them.
      - name: Whisper runtime (cached build, models and VAD)
        uses: ./.github/actions/whisper-runtime

      # Ollama model storage is also cached. The Ollama executable itself is
      # small and is installed quickly; the large model does not need to be
      # downloaded for every meeting.
      - name: Restore AI model cache
        id: ai-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen2.5-1.5b-instruct-q3_K_L-v1

      - name: Prepare AI engine on GitHub runner
        env:
          AI_MODEL: qwen2.5:1.5b-instruct-q3_K_L
          OLLAMA_MODELS: /home/runner/.ollama/models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$OLLAMA_MODELS"

          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done

          if ollama list | awk 'NR>1 {print $1}' | grep -Fxq "$AI_MODEL"; then
            echo "AI model restored from cache."
          else
            echo "AI model cache miss. Downloading model once for the cache..."
            ollama pull "$AI_MODEL"
          fi

          echo "AI engine ready."

      - name: Write QUEUED status
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: python processor/scripts/process_meeting.py --stage init

      - name: Diagnose Google Drive meeting access
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
        run: python processor/scripts/test_drive_connection.py

      - name: Whisper transcription
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: |
          echo "Processor will download audio and run Whisper."
          python processor/scripts/process_meeting.py --stage whisper

      - name: English translation
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: python processor/scripts/process_meeting.py --stage translation

      - name: AI understanding and evidence extraction
        env:
          AI_MODEL: qwen2.5:1.5b-instruct-q3_K_L
          OLLAMA_MODELS: /home/runner/.ollama/models
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: python processor/scripts/process_meeting.py --stage ai

      - name: MoM preparation and validation
        env:
          AI_MODEL: qwen2.5:1.5b-instruct-q3_K_L
          OLLAMA_MODELS: /home/runner/.ollama/models
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: python processor/scripts/process_meeting.py --stage mom

      - name: Record failure status
        if: failure()
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
          FAILED_STEP: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_ERROR_CODE: MOM-003
        run: python processor/scripts/process_meeting.py --stage fail

      - name: Verify local output contract
        run: |
          test -f .meeting_work/transcript.json
          test -f .meeting_work/translation.json
          test -f .meeting_work/ai_understanding.json
          test -f .meeting_work/AI_MOM.docx
          python - <<'PY'
          import json
          from pathlib import Path
          ai = json.loads(Path(".meeting_work/ai_understanding.json").read_text(encoding="utf-8"))
          required = [
              "executive_summary",
              "complete_conversation_summary",
              "discussion_points",
              "decisions",
              "action_items",
              "commitments",
              "open_questions",
              "next_meeting",
              "review_flags",
          ]
          missing = [k for k in required if k not in ai]
          if missing:
              raise SystemExit("Missing AI output fields: " + ", ".join(missing))
          print("ONLINE OUTPUT CONTRACT: PASS")
          PY

      - name: Results ready
        run: echo "Meeting transcript, translation, AI evidence and MoM are ready in Google Drive."

      - name: Cleanup temporary meeting data
        if: always()
        run: |
          echo "Cleaning ephemeral meeting workspace..."
          rm -rf .meeting_work
          test ! -e .meeting_work
          echo "Temporary meeting workspace removed."
