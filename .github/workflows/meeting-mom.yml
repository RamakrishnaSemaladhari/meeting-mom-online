name: Meeting MoM Online

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meeting-mom.yml"
      - "processor/**"
      - "processor/tests/**"
  workflow_dispatch:
  repository_dispatch:
    types: [meeting-ready]

permissions:
  contents: read

jobs:

  warm-processor-cache:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify system tools
        run: |
          missing=0
          for tool in ffmpeg cmake git curl; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: pre-installed"
            else
              echo "$tool: missing"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg cmake build-essential git curl
          fi

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: processor/requirements.txt

      - name: Install Python dependencies
        run: pip install -r processor/requirements.txt

      - name: Whisper runtime (cached build, models and VAD)
        uses: ./.github/actions/whisper-runtime

      - name: Restore AI model cache
        id: ai-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen3-fast-batch-1.7b-final-4b-v2

      - name: Prepare AI model cache
        env:
          AI_MODEL: qwen3:4b-instruct-2507-q4_K_M
          AI_BATCH_MODEL: qwen3:1.7b-q4_K_M
          AI_FINAL_MODEL: qwen3:4b-instruct-2507-q4_K_M
          AI_NUM_CTX: 8192
          AI_NUM_PREDICT: 1800
          AI_CHUNK_CHARS: 12000
          OLLAMA_MODELS: /home/runner/.ollama/models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$OLLAMA_MODELS"
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done

          if ollama list | awk 'NR>1 {print $1}' | grep -Fxq "qwen3:1.7b-q4_K_M" && ollama list | awk 'NR>1 {print $1}' | grep -Fxq "qwen3:4b-instruct-2507-q4_K_M"; then
            echo "Fast batch and final AI models restored from cache."
          else
            echo "AI model cache miss. Downloading fast batch + final models..."
            ollama pull "qwen3:1.7b-q4_K_M"
            ollama pull "qwen3:4b-instruct-2507-q4_K_M"
          fi

          echo "AI engine ready."

      - name: Write QUEUED status
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: python processor/scripts/process_meeting.py --stage init

      - name: Diagnose Google Drive meeting access
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
        run: python processor/scripts/test_drive_connection.py

      - name: Automatic 10-minute batch processing and final AI synthesis
        env:
          BATCH_SECONDS: 600
          AI_MODEL: qwen3:4b-instruct-2507-q4_K_M
          AI_NUM_CTX: 8192
          AI_NUM_PREDICT: 1400
          OLLAMA_MODELS: /home/runner/.ollama/models
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
          AUDIO_FILE_ID: ${{ github.event.client_payload.audio_file_id }}
        run: |
          echo "Long meeting mode: automatic 10-minute batches."
          echo "The browser uploads the complete recording once."
          echo "The processor splits it, preserves original-language transcript, creates English translation,"
          echo "runs evidence extraction per batch, then synthesizes one complete summary and one MoM."
          python processor/scripts/process_meeting.py --stage batch

      - name: Verify local output contract
        run: |
          test -f .meeting_work/transcript.json
          test -f .meeting_work/translation.json
          test -f .meeting_work/ai_understanding.json
          test -f .meeting_work/AI_MOM.docx
          python - <<'PY'
          import json
          from pathlib import Path
          ai = json.loads(Path(".meeting_work/ai_understanding.json").read_text(encoding="utf-8"))
          required = [
              "executive_summary",
              "complete_conversation_summary",
              "discussion_points",
              "decisions",
              "action_items",
              "commitments",
              "open_questions",
              "next_meeting",
              "review_flags",
          ]
          missing = [k for k in required if k not in ai]
          if missing:
              raise SystemExit("Missing AI output fields: " + ", ".join(missing))
          print("ONLINE OUTPUT CONTRACT: PASS")
          PY

      - name: Results ready
        run: echo "Meeting transcript, translation, AI evidence and MoM are ready in Google Drive."

      - name: Cleanup temporary meeting data
        if: always()
        run: |
          echo "Cleaning ephemeral meeting workspace..."
          rm -rf .meeting_work
          test ! -e .meeting_work
          echo "Temporary meeting workspace removed."
