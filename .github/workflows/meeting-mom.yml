name: Meeting MoM Online

on:
  workflow_dispatch:
  repository_dispatch:
    types: [meeting-ready]

permissions:
  contents: read

jobs:

  test-drive-connection:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r processor/requirements.txt

      - name: Test Google Drive access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python processor/scripts/test_drive_connection.py

  process-meeting:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Privacy boundary check
        run: python processor/scripts/privacy_check.py

      - name: Validate meeting request
        env:
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: |
          test -n "$MEETING_ID" || (echo "Meeting ID missing" && exit 1)
          test -n "$AUDIO_FOLDER_ID" || (echo "Audio folder ID missing" && exit 1)
          test -n "$MEETING_FOLDER_ID" || (echo "Meeting folder ID missing" && exit 1)
          echo "Meeting request validated."

      - name: Check Google Drive processor credential
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON GitHub secret is not configured."
            echo "The web application can upload audio, but the private Drive audio cannot be processed until the processor service account is configured."
            exit 1
          fi
          echo "Google Drive processor credential is available."

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake build-essential git curl

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r processor/requirements.txt

      - name: Prepare Whisper
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cmake -B whisper.cpp/build whisper.cpp
          cmake --build whisper.cpp/build -j --config Release
          mkdir -p whisper.cpp/models
          curl -L --fail --retry 3 -o whisper.cpp/models/ggml-small-q5_1.bin             https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin

      - name: Prepare AI engine on GitHub runner
        env:
          AI_MODEL: qwen2.5:1.5b-instruct-q3_K_L
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:11434/api/tags && break || sleep 2; done
          ollama pull "$AI_MODEL"

      - name: Whisper transcription
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: |
          echo "Processor will download audio and run Whisper."
          python processor/scripts/process_meeting.py --stage whisper

      - name: English translation
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: python processor/scripts/process_meeting.py --stage translation

      - name: AI understanding and evidence extraction
        env:
          AI_MODEL: qwen2.5:1.5b-instruct-q3_K_L
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: python processor/scripts/process_meeting.py --stage ai

      - name: MoM preparation and validation
        env:
          AI_MODEL: qwen2.5:1.5b-instruct-q3_K_L
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          AUDIO_FOLDER_ID: ${{ github.event.client_payload.audio_folder_id }}
          MEETING_FOLDER_ID: ${{ github.event.client_payload.meeting_folder_id }}
        run: python processor/scripts/process_meeting.py --stage mom

      - name: Results ready
        run: echo "Meeting transcript, translation, AI evidence and MoM are ready in Google Drive."
