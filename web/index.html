<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Meeting MoM</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box} body{margin:0} main{max-width:520px;margin:auto;padding:20px 16px 40px}
    .card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #00000012;margin-top:16px}
    h1{margin:4px 0 6px;font-size:30px}.muted{color:#6b7280}.status{padding:10px 12px;border-radius:12px;background:#f3f4f6;margin:16px 0;font-size:14px}
    label{display:block;font-weight:600;margin:14px 0 6px} input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}
    button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
    .primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.danger{background:#b91c1c;color:white}
    #timer{font-size:48px;text-align:center;font-variant-numeric:tabular-nums;margin:18px 0}.hidden{display:none!important}
    .small{font-size:13px}.success{background:#ecfdf5;color:#065f46}.error{background:#fef2f2;color:#991b1b}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Meeting MoM</h1>
    <div class="muted">Record → Drive → AI → Minutes of Meeting</div>
    <div id="status" class="status">Ready to connect Google Drive.</div>
    <button id="connectBtn" class="primary">Continue with Google</button>
  </div>

  <div id="meetingCard" class="card hidden">
    <label for="title">Meeting title</label>
    <input id="title" placeholder="e.g. Weekly Sales Review">
    <label for="agenda">Agenda</label>
    <input id="agenda" placeholder="Optional">
    <div id="timer">00:00:00</div>
    <button id="startBtn" class="primary">START RECORDING</button>
    <button id="stopBtn" class="danger hidden">STOP & SAVE</button>
    <div class="status small">Recording will use the native iOS recorder in the production build. This web layer handles meeting details, Drive authorization and processing status.</div>
  </div>
</main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
